name: Setup Kaggle Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # Set up Docker
    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    # Install dependencies and set up environment
    - name: Install jq and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    # Set Kaggle API credentials (add secrets to GitHub for security)
    - name: Configure Kaggle API Credentials
      run: |
        mkdir -p ~/.kaggle
        echo "${{ secrets.KAGGLE_JSON }}" > ~/.kaggle/kaggle.json
        chmod 600 ~/.kaggle/kaggle.json

    # Run the setup script
    - name: Run Setup Script
      run: |
        chmod +x ./setup_kaggle_container.sh
        ./setup_kaggle_container.sh /path/to/project kaggle-container python cpu

    # Test if the container was created and can be run
    - name: Verify Docker Container
      run: |
        docker ps -a | grep kaggle-container
